# This file controls the behavior of Trunk: https://docs.trunk.io/cli
# To learn more about the format of this file, see https://docs.trunk.io/reference/trunk-yaml
version: 0.1
cli:
  version: 1.25.0
# Trunk provides extensibility via plugins. (https://docs.trunk.io/plugins)
plugins:
  sources:
    - id: trunk
      ref: v1.11.0
      uri: https://github.com/trunk-io/plugins
# Many linters and tools depend on runtimes - configure them here. (https://docs.trunk.io/runtimes)
runtimes:
  enabled:
    - go@1.21.0
    - node@22.16.0
    - python@3.14.4
# This is the section where you manage your linters. (https://docs.trunk.io/check/configuration)
lint:
  enabled:
    # Held at 4.x: trunk's pinact plugin (v1.11.0) invokes pinact with v4-style
    # single-dash flags, which pinact v5 rejects. Revisit when the plugin supports v5.
    - pinact@4.1.1
    - grype@0.120.1
    - renovate@44.164.6
    - shellcheck@0.11.0
    - shfmt@3.14.1
    - gitleaks@8.30.1
    - codespell@2.4.3
    - actionlint@1.7.12
    - bandit@1.9.4
    - black@26.10.1
    - checkov@3.3.29
    - git-diff-check
    - isort@9.0.2
    - markdownlint@0.49.1
    - osv-scanner@2.7.0
    - prettier@3.9.10
    - ruff@0.17.1
    - taplo@0.10.0
    - trufflehog@3.99.2
    - yamllint@1.38.0
actions:
  disabled:
    - trunk-announce
  enabled:
    - trunk-check-pre-push
    - trunk-fmt-pre-commit
    - trunk-upgrade-available
